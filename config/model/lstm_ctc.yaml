# @package _global_
module:
  _target_: emg2qwerty.channel_lightning.LSTMCTCModule
  in_features: 429
  mlp_features: [384]
  hidden_size: 768   # = NUM_BANDS * mlp_features[-1], matches TDS output size
  num_layers: 2
  dropout: 0.2

datamodule:
  _target_: emg2qwerty.channel_lightning.WindowedEMGDataModule
  window_length: 8000
  padding: [1800, 200]
  train_fraction: 1.0

